name: SmartShoot
description: >-
  SmartShoot is a San Francisco-based (founded 2012) photography and video
  production platform that connects enterprises and marketing teams with a
  managed network of more than 200,000 professional photographers and
  videographers to produce custom, on-brand photo and video content at scale.
  The web-based platform coordinates shoot booking, project collaboration,
  editing, and cloud-based delivery across many locations, serving e-commerce,
  real estate, and multi-location brands such as Google, YouTube, Uber,
  Expedia, and Yelp. SmartShoot is a B2B managed-service marketplace with no
  publicly documented developer API, OpenAPI/AsyncAPI specification, SDK, MCP
  server, or developer portal as of this enrichment pass; it was surfaced as a
  portfolio company of Uncork Capital.
